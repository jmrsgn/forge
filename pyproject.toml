[project]
name = "forge"
version = "0.1.0"
description = "AI-assisted software engineering toolkit for structured, context-aware, and human-controlled development."
readme = "README.md"
authors = [
    { name = "John Martin Marasigan" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "typer>=0.29.1",
]

[project.scripts]
forge = "forge.cli:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
